<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Facebook Cover Render</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            width: 1640px;
            height: 624px;
            background: linear-gradient(135deg, #060911 0%, #0f172a 40%, #1e293b 80%, #060911 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
            padding: 40px 80px;
            color: #ffffff;
        }

        /* Ambient Glow Backgrounds */
        .glow-1 {
            position: absolute;
            width: 750px;
            height: 750px;
            background: radial-gradient(circle, rgba(2, 132, 199, 0.28) 0%, rgba(0,0,0,0) 70%);
            top: -220px;
            left: -120px;
            border-radius: 50%;
        }

        .glow-2 {
            position: absolute;
            width: 650px;
            height: 650px;
            background: radial-gradient(circle, rgba(255, 179, 0, 0.20) 0%, rgba(0,0,0,0) 70%);
            bottom: -180px;
            right: 80px;
            border-radius: 50%;
        }

        /* Subtle Grid Pattern Overlay */
        .grid-pattern {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
        }

        /* Left Column - Real Logo Card */
        .logo-box {
            position: relative;
            z-index: 10;
            width: 520px;
            height: 480px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            padding: 30px;
        }

        .logo-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0) 70%);
            border-radius: 30px;
        }

        .logo-img {
            max-width: 440px;
            max-height: 360px;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3)) drop-shadow(0 15px 30px rgba(0,0,0,0.7));
        }

        /* Right Column - Brand Information & Offerings */
        .info-container {
            position: relative;
            z-index: 10;
            width: 880px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(6, 182, 212, 0.15);
            border: 1px solid rgba(6, 182, 212, 0.4);
            color: #38bdf8;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 16px;
            width: fit-content;
        }

        .headline {
            font-family: 'Outfit', sans-serif;
            font-size: 52px;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .sub-headline {
            font-size: 22px;
            color: #94a3b8;
            font-weight: 500;
            margin-bottom: 28px;
        }

        /* Offerings Grid */
        .features-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 32px;
        }

        .feature-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            font-weight: 600;
            color: #f1f5f9;
            backdrop-filter: blur(10px);
        }

        .feature-icon {
            font-size: 20px;
        }

        /* Footer CTA Bar */
        .cta-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 179, 0, 0.4);
            border-radius: 18px;
            padding: 16px 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .url-text {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: #ffb300;
            letter-spacing: 0.5px;
        }

        .guarantee-text {
            font-size: 15px;
            font-weight: 600;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="glow-1"></div>
    <div class="glow-2"></div>
    <div class="grid-pattern"></div>

    <!-- Left Box: Authentic Logo -->
    <div class="logo-box">
        <div class="logo-wrapper">
            <img src="logo-transparent.png" alt="Punto Clave El Salvador" class="logo-img">
        </div>
    </div>

    <!-- Right Box: Business Info -->
    <div class="info-container">
        <div class="brand-badge">📍 Chalchuapa / El Salvador</div>
        <h1 class="headline">HARDWARE & TECNOLOGÍA</h1>
        <p class="sub-headline">Tu tienda de confianza en accesorios, componentes y electrónicos</p>

        <div class="features-grid">
            <div class="feature-pill">
                <span class="feature-icon">🎧</span>
                <span>Audífonos & Audio TWS</span>
            </div>
            <div class="feature-pill">
                <span class="feature-icon">💻</span>
                <span>Componentes PC & Laptops</span>
            </div>
            <div class="feature-pill">
                <span class="feature-icon">🎮</span>
                <span>Consolas & Accesorios</span>
            </div>
            <div class="feature-pill">
                <span class="feature-icon">🛠️</span>
                <span>Servicio & Mantenimiento</span>
            </div>
        </div>

        <div class="cta-bar">
            <div class="url-text">chavezvigil.github.io/punto-clave</div>
            <div class="guarantee-text">
                <span>🚚 Envíos Seguros a Todo El Salvador</span>
            </div>
        </div>
    </div>
</body>
</html>
