<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Facebook Cover Render Light</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            width: 1640px;
            height: 624px;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
            padding: 40px 80px;
            color: #0f172a;
        }

        /* Ambient Glow Backgrounds */
        .glow-1 {
            position: absolute;
            width: 750px;
            height: 750px;
            background: radial-gradient(circle, rgba(2, 132, 199, 0.12) 0%, rgba(0,0,0,0) 70%);
            top: -220px;
            left: -120px;
            border-radius: 50%;
        }

        .glow-2 {
            position: absolute;
            width: 650px;
            height: 650px;
            background: radial-gradient(circle, rgba(234, 179, 8, 0.15) 0%, rgba(0,0,0,0) 70%);
            bottom: -180px;
            right: 80px;
            border-radius: 50%;
        }

        /* Subtle Grid Pattern Overlay */
        .grid-pattern {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(15, 23, 42, 0.04) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
        }

        /* Left Column - Real Logo Card */
        .logo-box {
            position: relative;
            z-index: 10;
            width: 520px;
            height: 480px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08), inset 0 1px 0 #ffffff;
            padding: 30px;
        }

        .logo-img {
            max-width: 440px;
            max-height: 360px;
            object-fit: contain;
            filter: drop-shadow(0 8px 16px rgba(15, 23, 42, 0.12));
        }

        /* Right Column - Brand Information & Offerings */
        .info-container {
            position: relative;
            z-index: 10;
            width: 880px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(2, 132, 199, 0.1);
            border: 1px solid rgba(2, 132, 199, 0.3);
            color: #0284c7;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 16px;
            width: fit-content;
        }

        .headline {
            font-family: 'Outfit', sans-serif;
            font-size: 52px;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 12px;
            color: #0f172a;
            letter-spacing: -1px;
        }

        .sub-headline {
            font-size: 22px;
            color: #475569;
            font-weight: 500;
            margin-bottom: 28px;
        }

        /* Offerings Grid */
        .features-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 32px;
        }

        .feature-pill {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(203, 213, 225, 0.8);
            border-radius: 14px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
        }

        .feature-icon {
            font-size: 20px;
        }

        /* Footer CTA Bar */
        .cta-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            border: 1px solid rgba(234, 179, 8, 0.4);
            border-radius: 18px;
            padding: 16px 24px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.2);
            color: #ffffff;
        }

        .url-text {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: #facc15;
            letter-spacing: 0.5px;
        }

        .guarantee-text {
            font-size: 15px;
            font-weight: 600;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="glow-1"></div>
    <div class="glow-2"></div>
    <div class="grid-pattern"></div>

    <!-- Left Box: Authentic Logo -->
    <div class="logo-box">
        <img src="logo.png" alt="Punto Clave El Salvador" class="logo-img">
    </div>

    <!-- Right Box: Business Info -->
    <div class="info-container">
        <div class="brand-badge">📍 Chalchuapa / El Salvador</div>
        <h1 class="headline">HARDWARE & TECNOLOGÍA</h1>
        <p class="sub-headline">Tu tienda de confianza en accesorios, componentes y electrónicos</p>

        <div class="features-grid">
            <div class="feature-pill">
                <span class="feature-icon">🎧</span>
                <span>Audífonos & Audio TWS</span>
            </div>
            <div class="feature-pill">
                <span class="feature-icon">💻</span>
                <span>Componentes PC & Laptops</span>
            </div>
            <div class="feature-pill">
                <span class="feature-icon">🎮</span>
                <span>Consolas & Accesorios</span>
            </div>
            <div class="feature-pill">
                <span class="feature-icon">🛠️</span>
                <span>Servicio & Mantenimiento</span>
            </div>
        </div>

        <div class="cta-bar">
            <div class="url-text">chavezvigil.github.io/punto-clave</div>
            <div class="guarantee-text">
                <span>🚚 Envíos Seguros a Todo El Salvador</span>
            </div>
        </div>
    </div>
</body>
</html>
