<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Facebook Profile Render Light</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@700;800;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            width: 800px;
            height: 800px;
            background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 60%, #e2e8f0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* Ambient Light Glow Highlights */
        .glow-blue {
            position: absolute;
            width: 650px;
            height: 650px;
            background: radial-gradient(circle, rgba(2, 132, 199, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
            top: -100px;
            left: -100px;
            border-radius: 50%;
        }

        .glow-gold {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 179, 0, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            bottom: -100px;
            right: -100px;
            border-radius: 50%;
        }

        /* Avatar Container */
        .avatar-container {
            width: 720px;
            height: 720px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
            text-align: center;
        }

        /* Clean Vector SVG Logo */
        .logo-svg {
            width: 260px;
            height: 260px;
            filter: drop-shadow(0 12px 28px rgba(2, 132, 199, 0.25));
            margin-bottom: 24px;
        }

        .brand-title {
            font-family: 'Outfit', sans-serif;
            font-size: 68px;
            font-weight: 900;
            color: #0f172a;
            letter-spacing: -1.5px;
            line-height: 1;
            margin-bottom: 8px;
        }

        .brand-sub {
            font-family: 'Inter', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: #0284c7;
            letter-spacing: 10px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .tagline-badge {
            padding: 10px 28px;
            background: rgba(2, 132, 199, 0.08);
            border: 1.5px solid rgba(2, 132, 199, 0.3);
            border-radius: 30px;
            color: #0369a1;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.08);
        }
    </style>
</head>
<body>
    <div class="glow-blue"></div>
    <div class="glow-gold"></div>

    <div class="avatar-container">
        <!-- Exact Web Vector Logo SVG -->
        <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="pin-blue-l" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#0284c7" />
                    <stop offset="50%" stop-color="#0369a1" />
                    <stop offset="100%" stop-color="#0284c7" />
                </linearGradient>
                <linearGradient id="pin-gold-l" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#ffe066" />
                    <stop offset="50%" stop-color="#ffb300" />
                    <stop offset="100%" stop-color="#ff8f00" />
                </linearGradient>
            </defs>
            <path d="M50 92C43.5 92 18 63 18 42C18 24.3 32.3 10 50 10C67.7 10 82 24.3 82 42C82 63 56.5 92 50 92Z" 
                  fill="url(#pin-blue-l)" 
                  stroke="url(#pin-gold-l)" 
                  stroke-width="3.5" 
                  stroke-linejoin="round"/>
            <circle cx="50" cy="42" r="18" fill="#e0f2fe" stroke="url(#pin-gold-l)" stroke-width="2.5"/>
            <circle cx="50" cy="37" r="4.5" fill="url(#pin-gold-l)" />
            <polygon points="46 40 54 40 56 51 44 51" fill="url(#pin-gold-l)" />
        </svg>

        <h1 class="brand-title">Punto Clave</h1>
        <div class="brand-sub">EL SALVADOR</div>
        <div class="tagline-badge">HARDWARE & TECNOLOGÍA</div>
    </div>
</body>
</html>
