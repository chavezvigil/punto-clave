<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Facebook Profile Render Light</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@700;800&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            width: 800px;
            height: 800px;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 50%, #cbd5e1 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* Ambient Glow Highlights */
        .glow-blue {
            position: absolute;
            width: 650px;
            height: 650px;
            background: radial-gradient(circle, rgba(2, 132, 199, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            top: -120px;
            left: -120px;
            border-radius: 50%;
        }

        .glow-gold {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(234, 179, 8, 0.18) 0%, rgba(0, 0, 0, 0) 70%);
            bottom: -120px;
            right: -120px;
            border-radius: 50%;
        }

        /* Circular Avatar Card */
        .avatar-card {
            width: 720px;
            height: 720px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12), inset 0 1px 0 #ffffff;
            position: relative;
            z-index: 10;
            padding: 50px;
        }

        .logo-img {
            max-width: 520px;
            max-height: 380px;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(15, 23, 42, 0.15));
        }

        .tagline {
            margin-top: 30px;
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 6px;
            color: #0284c7;
            text-transform: uppercase;
            border-top: 2px solid rgba(2, 132, 199, 0.2);
            padding-top: 18px;
        }
    </style>
</head>
<body>
    <div class="glow-blue"></div>
    <div class="glow-gold"></div>

    <div class="avatar-card">
        <img src="logo.png" alt="Punto Clave Logo" class="logo-img">
        <div class="tagline">HARDWARE & TECNOLOGÍA</div>
    </div>
</body>
</html>
